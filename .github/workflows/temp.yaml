name: Recover Android Secrets

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    
    steps:
      - name: Create recovery directory
        run: |
          rm -rf recovery
          mkdir -p recovery/android
    
      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi
    
          echo "$KEYSTORE_BASE64" | base64 --decode > recovery/android/upload-keystore.jks
    
          if [ ! -s recovery/android/upload-keystore.jks ]; then
            echo "Keystore restoration failed."
            exit 1
          fi
    
      - name: Restore key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "One or more Android signing secrets are missing."
            exit 1
          fi
    
          cat > recovery/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
    
      - name: Restore keys.json
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          COMMENTUM_API_URL: ${{ secrets.COMMENTUM_API_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
    
          data = {
              "ANILIST_CLIENT_ID": os.environ["ANILIST_CLIENT_ID"],
              "ANILIST_CLIENT_SECRET": os.environ["ANILIST_CLIENT_SECRET"],
              "MAL_CLIENT_ID": os.environ["MAL_CLIENT_ID"],
              "MAL_CLIENT_SECRET": os.environ["MAL_CLIENT_SECRET"],
              "SIMKL_CLIENT_ID": os.environ["SIMKL_CLIENT_ID"],
              "SIMKL_CLIENT_SECRET": os.environ["SIMKL_CLIENT_SECRET"],
              "COMMENTUM_API_URL": os.environ["COMMENTUM_API_URL"],
              "RELEASE_REPO": "roshancodespace/ShonenX"
          }
    
          with open("recovery/keys.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
    
      - name: Create README
        run: |
          cat > recovery/README.md <<'EOF'
          # ShonenX Secret Recovery
    
          This archive contains recovered local configuration files.
    
          ## Files
    
          ```
          android/
          ├── upload-keystore.jks
          └── key.properties
    
          keys.json
          README.md
          ```
    
          ## Where to put the files
    
          From the root of the ShonenX Flutter project:
    
          1. Copy `keys.json` to the location expected by the application.
          2. Copy `android/upload-keystore.jks` to:
    
             android/upload-keystore.jks
    
          3. Copy:
    
             android/key.properties
    
             to:
    
             android/key.properties
    
          ## Android signing
    
          `android/key.properties` contains the signing credentials used by
          the Gradle Android build.
    
          Do NOT commit these files to Git.
    
          Recommended .gitignore entries:
    
          ```
          android/key.properties
          android/upload-keystore.jks
          keys.json
          ```
    
          ## Important
    
          Treat this ZIP as highly sensitive.
    
          It contains:
          - Android signing credentials
          - OAuth/API credentials
          - The Android upload keystore
    
          After downloading and verifying the files, delete the GitHub Actions
          artifact and remove this recovery workflow if it is no longer needed.
    
          Never upload this ZIP to a public repository or share it publicly.
          EOF
    
      - name: Verify recovered files
        run: |
          echo "Recovered files:"
          find recovery -type f -printf '%p (%s bytes)\n'
    
          test -s recovery/android/upload-keystore.jks
          test -s recovery/android/key.properties
          test -s recovery/keys.json
          test -s recovery/README.md
    
          echo "All recovery files were created successfully."
    
      - name: Create ZIP
        run: |
          cd recovery
          zip -r ../ShonenX-secret-recovery.zip .
          cd ..
    
          echo "Created:"
          ls -lh ShonenX-secret-recovery.zip
    
      - name: Upload recovery ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ShonenX-secret-recovery
          path: ShonenX-secret-recovery.zip
          retention-days: 1
          if-no-files-found: error
