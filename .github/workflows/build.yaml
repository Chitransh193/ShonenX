name: Build ShonenX

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Official ShonenX ref to build (branch, tag, or commit)'
        required: true
        type: string
        default: main
      flutter_version:
        description: 'Flutter version used for the build'
        required: true
        type: string
        default: 3.50.1
      release_tag:
        description: 'Release Tag (Leave empty to auto-extract from pubspec.yaml)'
        required: false
        type: string
      upgrade_dependencies:
        description: 'Run flutter pub upgrade instead of pub get'
        type: boolean
        default: false
      build_android:
        description: 'Build Android APKs'
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux Zip, AppImage & Flatpak'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows Portable & Installer'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS App'
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS IPA'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  start_building:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Notify Telegram — Build Started
        run: |
          MSG=$(cat <<EOF
          <b>Build Initiated: ShonenX</b>

          <b>Branch:</b> <code>${{ github.ref_name }}</code>
          <b>Triggered by:</b> <code>${{ github.actor }}</code>
          <b>Repository:</b> <a href="https://github.com/${{ github.repository }}">View Repository</a>

          <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Action Logs</a>
          EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F parse_mode="HTML" \
            -F disable_web_page_preview="true" \
            --form-string text="$MSG"

  build-android:
    if: github.event.inputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official ShonenX source
        uses: actions/checkout@v4
        with:
          repository: roshancodespace/ShonenX
          ref: ${{ github.event.inputs.source_ref }}
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Apply inbuilt sources override
        shell: bash
        run: |
          OVERRIDE_FILE="lib/source_engine/providers/inbuilt_sources_provider.dart"
          curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/${OVERRIDE_FILE}?ref=${{ github.sha }}" \
            -o "${OVERRIDE_FILE}"

      - name: Override pubspec.yaml version
        if: github.event.inputs.release_tag != ''
        shell: bash
        run: |
          CLEAN_VER="${{ github.event.inputs.release_tag }}"
          CLEAN_VER="${CLEAN_VER#v}"
          EXISTING_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$EXISTING_VER" == *"+"* ]] && [[ "$CLEAN_VER" != *"+"* ]]; then
            BUILD_NUM="+${EXISTING_VER#*+}"
            CLEAN_VER="${CLEAN_VER}${BUILD_NUM}"
          fi
          echo "Overriding pubspec.yaml version to: $CLEAN_VER"
          sed -i -e "s/^version: .*/version: $CLEAN_VER/g" pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          cache: true

      - name: Setup Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-rust

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Create env file
        run: |
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "Chitransh193/ShonenX"
          }
          EOF

      - name: Resolve Dependencies
        shell: bash
        run: |
          if [ "${{ github.event.inputs.upgrade_dependencies }}" == 'true' ]; then
            flutter pub upgrade
          else
            flutter pub get
          fi

      - name: Build APKs
        run: flutter build apk --release --split-per-abi --dart-define-from-file=keys.json

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk

  build-linux:
    if: github.event.inputs.build_linux == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Install system dependencies
        run: |
          pacman -Sy --needed --noconfirm git jq zip unzip curl xz tar clang cmake ninja pkgconf gtk3 libsecret webkit2gtk-4.1 mpv alsa-lib rustup flatpak flatpak-builder
          pacman -Scc --noconfirm

      - name: Setup Rust toolchain
        run: rustup default stable

      - name: Trust git directory
        run: git config --global --add safe.directory '*'

      - name: Checkout official ShonenX source
        uses: actions/checkout@v4
        with:
          repository: roshancodespace/ShonenX
          ref: ${{ github.event.inputs.source_ref }}
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Apply inbuilt sources override
        shell: bash
        run: |
          OVERRIDE_FILE="lib/source_engine/providers/inbuilt_sources_provider.dart"
          curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/${OVERRIDE_FILE}?ref=${{ github.sha }}" \
            -o "${OVERRIDE_FILE}"

      - name: Override pubspec.yaml version
        if: github.event.inputs.release_tag != ''
        shell: bash
        run: |
          CLEAN_VER="${{ github.event.inputs.release_tag }}"
          CLEAN_VER="${CLEAN_VER#v}"
          EXISTING_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$EXISTING_VER" == *"+"* ]] && [[ "$CLEAN_VER" != *"+"* ]]; then
            BUILD_NUM="+${EXISTING_VER#*+}"
            CLEAN_VER="${CLEAN_VER}${BUILD_NUM}"
          fi
          sed -i -e "s/^version: .*/version: $CLEAN_VER/g" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-rust

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create env file
        run: |
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "Chitransh193/ShonenX"
          }
          EOF

      - name: Enable Linux config
        run: flutter config --enable-linux-desktop

      - name: Clean stale build directory
        run: rm -rf build

      - name: Resolve Dependencies
        shell: bash
        run: |
          if [ "${{ github.event.inputs.upgrade_dependencies }}" == 'true' ]; then
            flutter pub upgrade
          else
            flutter pub get
          fi

      - name: Build Linux app release bundle
        run: flutter build linux --release --dart-define-from-file=keys.json -v

      - name: Create Linux Portable Zip
        shell: bash
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../ShonenX-linux-portable.zip .

      - name: Build AppImage
        shell: bash
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          APPDIR="AppDir"
          EXE_PATH=$(find $BUNDLE_DIR -maxdepth 1 -type f -executable -not -name "*.so" | head -n 1)
          EXE_NAME=$(basename "$EXE_PATH")
          mkdir -p $APPDIR
          cp -r $BUNDLE_DIR/* $APPDIR/
          cat << EOF > $APPDIR/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          export LD_LIBRARY_PATH="\${HERE}/lib:\${LD_LIBRARY_PATH}"
          exec "\${HERE}/$EXE_NAME" "\$@"
          EOF
          chmod +x $APPDIR/AppRun
          cat << EOF > $APPDIR/$EXE_NAME.desktop
          [Desktop Entry]
          Version=1.0
          Name=ShonenX
          Exec=$EXE_NAME
          Icon=$EXE_NAME
          Type=Application
          Terminal=false
          Categories=Utility;
          EOF
          if [ -f "linux/application_icon.png" ]; then
            cp linux/application_icon.png $APPDIR/$EXE_NAME.png
          elif [ -n "$(find linux -name "*.png" | head -n 1)" ]; then
            cp $(find linux -name "*.png" | head -n 1) $APPDIR/$EXE_NAME.png
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > $APPDIR/$EXE_NAME.png
          fi
          curl -sLO https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run $APPDIR ShonenX-linux-x86_64.AppImage

      - name: Build Flatpak
        shell: bash
        run: |
          rm -rf flatpak/bundle
          mkdir -p flatpak/bundle
          cp -r build/linux/x64/release/bundle/* flatpak/bundle/

          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47

          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse --repo=repo build-dir flatpak/com.roshancodespace.shonenx.yml
          flatpak build-bundle repo ShonenX-linux-x86_64.flatpak com.roshancodespace.shonenx

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            ShonenX-linux-portable.zip
            ShonenX-linux-x86_64.AppImage
            ShonenX-linux-x86_64.flatpak

  build-windows:
    if: github.event.inputs.build_windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout official ShonenX source
        uses: actions/checkout@v4
        with:
          repository: roshancodespace/ShonenX
          ref: ${{ github.event.inputs.source_ref }}
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Apply inbuilt sources override
        shell: bash
        run: |
          OVERRIDE_FILE="lib/source_engine/providers/inbuilt_sources_provider.dart"
          curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/${OVERRIDE_FILE}?ref=${{ github.sha }}" \
            -o "${OVERRIDE_FILE}"

      - name: Override pubspec.yaml version
        if: github.event.inputs.release_tag != ''
        shell: bash
        run: |
          CLEAN_VER="${{ github.event.inputs.release_tag }}"
          CLEAN_VER="${CLEAN_VER#v}"
          EXISTING_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$EXISTING_VER" == *"+"* ]] && [[ "$CLEAN_VER" != *"+"* ]]; then
            BUILD_NUM="+${EXISTING_VER#*+}"
            CLEAN_VER="${CLEAN_VER}${BUILD_NUM}"
          fi
          sed -i -e "s/^version: .*/version: $CLEAN_VER/g" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          cache: true

      - name: Setup Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-rust

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Enable Windows config
        run: flutter config --enable-windows-desktop

      - name: Create env file
        shell: bash
        run: |
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "Chitransh193/ShonenX"
          }
          EOF

      - name: Resolve Dependencies
        shell: bash
        run: |
          if [ "${{ github.event.inputs.upgrade_dependencies }}" == 'true' ]; then
            flutter pub upgrade
          else
            flutter pub get
          fi

      - name: Pre-seed media_kit Windows native bundle
        shell: bash
        run: |
          set -euo pipefail
          CHECKSUM=bb6ce9e53c083002fad640011632aef96167cb1d4fffcfe4ed79acbc153bb497
          URL=https://github.com/Predidit/libmpv-win32-video-cmake/releases/download/202611230430/mpv-dev-x86_64-20261123-git-1eb941f.7z
          CACHE=".dart_tool/hooks_runner/shared/media_kit/build/prebuilt/$CHECKSUM"
          mkdir -p "$CACHE/files"
          curl -fsSL "$URL" -o "$CACHE/archive.7z"
          ACTUAL=$(sha256sum "$CACHE/archive.7z" | cut -d' ' -f1)
          if [ "$ACTUAL" != "$CHECKSUM" ]; then
            echo "Bundle checksum mismatch: $ACTUAL"; exit 1
          fi
          SEVENZ=$(command -v 7z || echo "/c/Program Files/7-Zip/7z.exe")
          "$SEVENZ" x -y "-o$(cygpath -w "$CACHE/files")" "$CACHE/archive.7z" >/dev/null
          cd "$CACHE/files"
          python -c "
          import hashlib, json, os
          hashes = {}
          for root, _, files in os.walk('.'):
              for name in files:
                  path = os.path.relpath(os.path.join(root, name), '.').replace(os.sep, '/')
                  with open(path, 'rb') as fh:
                      hashes[path] = hashlib.sha256(fh.read()).hexdigest()
          with open('../extracted.json', 'w') as fh:
              json.dump(hashes, fh)
          print('seeded', len(hashes), 'files')
          "
          cd -

      - name: Build Windows app
        shell: bash
        run: |
          flutter build windows --release --dart-define-from-file=keys.json || {
            echo "First build failed (likely due to media_kit libmpv download race condition). Retrying..."
            flutter build windows --release --dart-define-from-file=keys.json
          }

      - name: Dump native asset hook errors on failure
        if: failure()
        shell: bash
        run: |
          echo "=== native asset hook stderr/stdout ==="
          find .dart_tool/hooks_runner -type f \( -name 'stderr.txt' -o -name 'stdout.txt' \) -print -exec cat {} \; 2>/dev/null || true

      - name: Create Windows Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "ShonenX-windows-portable.zip" -Force

      - name: Build installer (InnoBundle)
        run: dart run inno_bundle --release --no-app

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            build/windows/x64/installer/Release/*.exe
            ShonenX-windows-portable.zip

  build-macos:
    if: github.event.inputs.build_macos == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout official ShonenX source
        uses: actions/checkout@v4
        with:
          repository: roshancodespace/ShonenX
          ref: ${{ github.event.inputs.source_ref }}
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Apply inbuilt sources override
        shell: bash
        run: |
          OVERRIDE_FILE="lib/source_engine/providers/inbuilt_sources_provider.dart"
          curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/${OVERRIDE_FILE}?ref=${{ github.sha }}" \
            -o "${OVERRIDE_FILE}"

      - name: Override pubspec.yaml version
        if: github.event.inputs.release_tag != ''
        shell: bash
        run: |
          CLEAN_VER="${{ github.event.inputs.release_tag }}"
          CLEAN_VER="${CLEAN_VER#v}"
          EXISTING_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$EXISTING_VER" == *"+"* ]] && [[ "$CLEAN_VER" != *"+"* ]]; then
            BUILD_NUM="+${EXISTING_VER#*+}"
            CLEAN_VER="${CLEAN_VER}${BUILD_NUM}"
          fi
          sed -i '' -e "s/^version: .*/version: $CLEAN_VER/g" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          cache: true

      - name: Setup Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-rust

      - name: Cache Pub & CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Enable macOS config
        run: flutter config --enable-macos-desktop

      - name: Create env file
        run: |
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "Chitransh193/ShonenX"
          }
          EOF

      - name: Resolve Dependencies
        shell: bash
        run: |
          if [ "${{ github.event.inputs.upgrade_dependencies }}" == 'true' ]; then
            flutter pub upgrade
          else
            flutter pub get
          fi

      - name: Build macOS app
        run: flutter build macos --release --dart-define-from-file=keys.json

      - name: Package macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -qry ../../../../../ShonenX-macos.zip *.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: ShonenX-macos.zip

  build-ios:
    if: github.event.inputs.build_ios == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout official ShonenX source
        uses: actions/checkout@v4
        with:
          repository: roshancodespace/ShonenX
          ref: ${{ github.event.inputs.source_ref }}
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Apply inbuilt sources override
        shell: bash
        run: |
          OVERRIDE_FILE="lib/source_engine/providers/inbuilt_sources_provider.dart"
          curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/${OVERRIDE_FILE}?ref=${{ github.sha }}" \
            -o "${OVERRIDE_FILE}"

      - name: Override pubspec.yaml version
        if: github.event.inputs.release_tag != ''
        shell: bash
        run: |
          CLEAN_VER="${{ github.event.inputs.release_tag }}"
          CLEAN_VER="${CLEAN_VER#v}"
          EXISTING_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$EXISTING_VER" == *"+"* ]] && [[ "$CLEAN_VER" != *"+"* ]]; then
            BUILD_NUM="+${EXISTING_VER#*+}"
            CLEAN_VER="${CLEAN_VER}${BUILD_NUM}"
          fi
          sed -i '' -e "s/^version: .*/version: $CLEAN_VER/g" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          cache: true

      - name: Setup Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-rust

      - name: Cache Pub & CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Create env file
        run: |
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "Chitransh193/ShonenX"
          }
          EOF

      - name: Resolve Dependencies
        shell: bash
        run: |
          if [ "${{ github.event.inputs.upgrade_dependencies }}" == 'true' ]; then
            flutter pub upgrade
          else
            flutter pub get
          fi

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign --dart-define-from-file=keys.json

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry ShonenX-ios-unsigned.ipa Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ShonenX-ios-unsigned.ipa

  create-release:
    needs: [start_building, build-android, build-linux, build-windows, build-macos, build-ios]
    if: >-
      always() &&
      (needs.build-android.result == 'success' ||
       needs.build-linux.result == 'success' ||
       needs.build-windows.result == 'success' ||
       needs.build-macos.result == 'success' ||
       needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: roshancodespace/ShonenX
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_TAG:-}"
          requested="$(echo "$requested" | xargs)"
          if [ -n "$requested" ]; then
            tag="${requested#v}"
            tag="v${tag}"
          else
            version="$(awk '/^version:[[:space:]]*/ {print $2; exit}' pubspec.yaml | cut -d+ -f1)"
            if [ -z "$version" ]; then
              echo "Could not read version from pubspec.yaml" >&2
              exit 1
            fi
            tag="v${version}"
          fi
          echo "Resolved release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          else
            PREV=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          fi
          if [ -n "$PREV" ]; then
            COMMITS=$(git log "${PREV}..HEAD" --pretty=format:"- %s (%h)")
            COMPARE="https://github.com/roshancodespace/ShonenX/compare/${PREV}...${TAG}"
          else
            COMMITS=$(git log -n 30 --pretty=format:"- %s (%h)")
            COMPARE=""
          fi
          NOTES=""
          if [ -n "$GEMINI_API_KEY" ]; then
            PROMPT="Format these commit messages into concise Markdown release notes for ${TAG}. Keep only user-facing changes. No emojis. Return only the notes. Commits: ${COMMITS}"
            PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{"text": $prompt}]}]}')
            for MODEL in gemini-2.5-flash gemini-2.5-pro gemini-1.5-flash; do
              RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${GEMINI_API_KEY}" -H "Content-Type: application/json" -d "$PAYLOAD" || true)
              NOTES=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || true)
              if [ -n "$NOTES" ]; then
                break
              fi
            done
          fi
          if [ -z "$NOTES" ]; then
            NOTES="## What's Changed"$'\n\n'"${COMMITS}"
          fi
          if [ -n "$COMPARE" ]; then
            NOTES="${NOTES}"$'\n\n---\n**Full Changelog**: '"${COMPARE}"
          fi
          printf '%s\n' "$NOTES" > release_notes.md

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        shell: bash
        run: ls -lh release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Telegram — Release Published
        continue-on-error: true
        shell: bash
        run: |
          URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}"
          MSG=$(cat <<EOF
          <b>ShonenX Release: <code>${{ steps.tag.outputs.tag }}</code></b>

          <a href="${URL}">View Release &amp; Downloads</a>
          EOF
          )
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F parse_mode="HTML" \
            -F disable_web_page_preview="true" \
            --form-string text="$MSG"
